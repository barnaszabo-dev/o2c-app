function regKpis(d){const te=d.test,b=d.baseline_median,sp=d.split;return`<div class="grid g4"><div class="card"><div class="kl">R² (test)</div><div class="kv">${f2(te.r2)}</div><div class="ref">Adjusted R²: ${f2(te.adj_r2)} · Train R²: ${f2(d.train.r2)}</div></div><div class="card"><div class="kl">MAE (test)</div><div class="kv">${h(te.mae)}</div><div class="ref">Baseline (train median): ${h(b.mae)}</div></div><div class="card"><div class="kl">RMSE (test)</div><div class="kv">${h(te.rmse)}</div><div class="ref">Baseline: ${h(b.rmse)}</div></div><div class="card"><div class="kl">Observations (train / test)</div><div class="kv" style="font-size:20px;padding:4px 0">${sp.n_train.toLocaleString(LOC())} / ${sp.n_test.toLocaleString(LOC())}</div><div class="ref">Test from ${sp.cutoff}</div></div></div>`}

function mlrHtml(d){const co=d.coefficients.slice().sort((a,b)=>(a.type==='intercept')-(b.type==='intercept')||Math.abs(b.std_beta||0)-Math.abs(a.std_beta||0));const mx=Math.max(...co.filter(c=>c.type!=='intercept').map(c=>Math.abs(c.effect)),1);
 return regCtl()+`${insights(d)}${regKpis(d)}<div class="card" style="margin-bottom:14px"><h3>Regression coefficients</h3><div class="sc"><table><tr><th>Variable</th><th>Effect (${d.log_target?'%':'h'})</th><th class="num">95% CI</th><th class="num">p-value</th><th class="num">Std. beta</th><th class="num">VIF</th></tr>${co.map(c=>`<tr style="${c.p<.05||c.type==='intercept'?'':'opacity:.55'}"><td>${c.type==='intercept'?'Intercept':esc(L(c.label))+(c.type==='dummy'?`: ${esc(L(c.level))} vs ${esc(L(c.ref))}`:'')}</td><td style="min-width:170px"><div class="br" style="grid-template-columns:1fr 70px"><div class="bt"><div class="bf" style="width:${Math.min(100,Math.abs(c.effect)/mx*100)}%;${c.effect<0?'background:var(--red)':''}"></div></div><b>${c.effect>0?'+':''}${fmt(c.effect)}</b></div></td><td class="num">${fmt(c.ci_low)} … ${fmt(c.ci_high)}</td><td class="num">${pf(c.p)}</td><td class="num">${f2(c.std_beta)}</td><td class="num ${c.vif>10?'bad':''}">${c.vif==null?'–':fmt(c.vif)}</td></tr>`).join('')}</table></div><div class="note">Robust (HC3) standard errors. Effects compare each category with its reference category; they are associations, not causal effects. Faded rows: p ≥ 0.05.</div></div>

function impHtml(d){const im=d.importance,sh=d.shap,u=sh.unit,mxp=Math.max(...im.map(i=>i.perm_mean),.1),mxs=Math.max(...im.map(i=>i.shap_mean_abs||0),.1),mxi=Math.max(...im.map(i=>i.impurity),.01);
 const rank=`<div class="card" style="margin-bottom:14px"><h3>Feature importance ranking</h3><div class="sc"><table><tr><th>#</th><th>Variable</th><th>Permutation importance (test) (h)</th><th>SHAP mean |contribution| (h)</th><th>Impurity importance</th></tr>${im.map((i,k)=>`<tr><td>${k+1}</td><td>${esc(L(i.label))}${i.review?' ⚠':''}</td>${barCell(i.perm_mean/mxp,(i.perm_mean>0?'+':'')+fmt(i.perm_mean)+' ± '+fmt(i.perm_sd),i.perm_mean<0)}${i.shap_mean_abs==null?'<td>–</td>':barCell(i.shap_mean_abs/mxs,fmt(i.shap_mean_abs)+' '+u)}${barCell(i.impurity/mxi,Math.round(i.impurity*100)+'%')}</tr>`).join('')}</table></div><div class="note">${d.rank_agreement==null?(sh.available?'':'SHAP unavailable (pip install shap)'):'Rank agreement (permutation vs SHAP): '+f2(d.rank_agreement)} · Positive = longer predicted lead time, negative = shorter, compared with the average prediction.</div></div>`;

 const cov=`<div class="card" style="margin-top:14px"><h3>Variable coverage (all candidate variables)</h3><div class="sc"><table><tr><th>Variable</th><th>Status</th><th>Reason</th></tr>${d.coverage.map(c=>`<tr><td>${esc(L(c.label))}</td><td class="${c.status==='used'?'ok':''}">${c.status}</td><td class="note" style="white-space:normal">${esc(L(c.reason||''))}</td></tr>`).join('')}</table></div></div>`;
